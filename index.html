<!DOCTYPE html>
<html lang="en">
<head>
    <title>Todo App</title>
    <meta charset="utf-8">
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
<main class="wrapper">
    <div class="eisenhower-info">
        <img src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix diagram">
        <a class="more_inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want
            more details?</a>
    </div>
    <section class="centered-main-page-element">
        <div id="add-task-section">
            <h2>Add Item</h2>
            <div class="task-row-wrapper">
                <input id="new-task" class="task" type="text">
                <button id="add-btn" class="add-btn">Add</button>
            </div>
        </div>
    </section>
    <section class="block-incomplete-tasks">
        <h2>Todo</h2>
        <ul id='incompleteTasks'>
            <li>
                <input type="checkbox">
                <label class="task">Pay Bills</label>
                <input type="text" class="task">
                <button class="edit">Edit</button>
                <button class="delete-btn">
                    <img src="./remove.svg" alt="remove">
                </button>
            </li>
            <li class="editMode">
                <input type="checkbox">
                <label class="task">Go Shopping</label>
                <input type="text" value="Go Shopping" class="task">
                <button class="edit">Save</button>
                <button class="delete-btn"><img src="./remove.svg" alt="button remove"></button>
            </li>
        </ul>
    </section>
    <section class="block-completed-tasks">
        <h2>Completed</h2>
        <ul id="completed-tasks">
            <li>
                <input type="checkbox" checked>
                <label class="task">See the Doctor</label>
                <input type="text" class="task">
                <button class="edit">Edit</button>
                <button class="delete-btn"><img src="./remove.svg" alt="button remove"></button>
            </li>
        </ul>
    </section>
</main>
<script src="app.js"></script>
</body>
</html>
