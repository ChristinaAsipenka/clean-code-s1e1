<!DOCTYPE html>
<html lang="en">
<head>
    <title>Todo App</title>
    <meta charset="utf-8">
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
<main class="page-wrapper">
    <div class="eisenhower-block">
        <img src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix diagram">
        <a class="eisenhower-block__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want
            more details?</a>
    </div>
    <section class="add-task-form">
        <h2>Add Item</h2>
        <div class="add-task-form__controls">
            <input id="new-task" class="add-task-form__input" type="text">
            <button id="add-btn" class="add-task-form__button--add">Add</button>
        </div>
    </section>
    <section class="task-list task-list--incomplete">
        <h2>Todo</h2>
        <ul id='incompleteTasks'>
            <li class="task-list__item">
                <input type="checkbox">
                <label class="task-list__label">Pay Bills</label>
                <input type="text" class="task-list__input">
                <button class="task-list__button--edit">Edit</button>
                <button class="task-list__button--delete">
                    <img src="./remove.svg" alt="remove">
                </button>
            </li>
            <li class="task-list__item task-list__item--editing">
                <input type="checkbox">
                <label class="task-list__label">Go Shopping</label>
                <input type="text" value="Go Shopping" class="task-list__input">
                <button class="task-list__button--edit">Save</button>
                <button class="task-list__button--delete"><img src="./remove.svg" alt="button remove"></button>
            </li>
        </ul>
    </section>
    <section class="task-list task-list--completed">
        <h2>Completed</h2>
        <ul id="completed-tasks">
            <li class="task-list__item">
                <input type="checkbox" checked>
                <label class="task-list__label">See the Doctor</label>
                <input type="text" class="task-list__input">
                <button class="task-list__button--edit">Edit</button>
                <button class="task-list__button--delete"><img src="./remove.svg" alt="button remove"></button>
            </li>
        </ul>
    </section>
</main>
<script src="app.js"></script>
</body>
</html>
